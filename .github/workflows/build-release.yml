name: Build & Release Zip

on:
  push:
    branches:
      - dev
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to build (for example: v5.1.0 or v5.1.0-beta.1)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        run: |
          set -euo pipefail

          BUILD_NUMBER="${{ github.run_number }}"
          EVENT_NAME="${{ github.event_name }}"
          INPUT_TAG="${{ github.event.inputs.tag }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            RELEASE_KIND="tag"
            RELEASE_TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_KIND="tag"
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_KIND="branch"
            RELEASE_BRANCH="${{ github.ref_name }}"
            RELEASE_BRANCH_SLUG="$(printf '%s' "$RELEASE_BRANCH" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
            RELEASE_TAG="${RELEASE_BRANCH_SLUG}-latest"
          fi

          if [ "$RELEASE_KIND" = "tag" ]; then
            VERSION="${RELEASE_TAG#v}"
            RELEASE_TITLE="v$VERSION"
            if [[ "$VERSION" == *"-beta"* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          else
            BASE_VERSION=$(awk '/^## \[/{ line=$0; sub(/^## \[/, "", line); sub(/\].*/, "", line); print line; exit }' CHANGELOG.md)
            BASE_VERSION="${BASE_VERSION%%-beta*}"
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE_VERSION}-${RELEASE_BRANCH_SLUG}.${BUILD_NUMBER}"
            RELEASE_TITLE="${RELEASE_TAG} (${BASE_VERSION}, ${SHORT_SHA})"
            IS_PRERELEASE=true
          fi

          ARCHIVE_NAME="MacShot-${VERSION}.zip"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_KIND=$RELEASE_KIND" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH:-}" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH_SLUG=${RELEASE_BRANCH_SLUG:-}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package zip
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/MacShot.app" \
            "$ARCHIVE_NAME"

          ls -lh "$ARCHIVE_NAME"

      - name: Generate release notes
        run: |
          set -euo pipefail

          if [ "$RELEASE_KIND" = "tag" ]; then
            awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" \
              CHANGELOG.md > release_notes.md
            if [ ! -s release_notes.md ]; then
              echo "❌ ERROR: missing CHANGELOG.md entry for $VERSION"
              exit 1
            fi
          else
            {
              echo "Automated pre-release build from \`${RELEASE_BRANCH}\`."
              echo
              echo "- Version: \`${VERSION}\`"
              echo "- Commit: \`${GITHUB_SHA}\`"
              echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > release_notes.md
          fi

          cat >> release_notes.md <<'EOF'

          ### Install
          1. Download the zip and unzip it.
          2. Drag `MacShot.app` into `/Applications`.
          3. Because this build is not signed or notarized, macOS may show a security warning on first launch.
          4. If that happens, right-click `MacShot.app` and choose **Open** once to allow it.
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DELETE_ARGS=""
          if [ "$RELEASE_KIND" = "branch" ]; then
            DELETE_ARGS="--cleanup-tag"
          fi
          gh release delete "$RELEASE_TAG" --yes $DELETE_ARGS 2>/dev/null || true

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$RELEASE_TAG" "$ARCHIVE_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG
